<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | SoulSketch</title>

    <!-- ⭕ 解決冷啟動誤開啟長焦鏡頭：取得權限後立即無縫切換至 1x 主廣角鏡頭 -->
    <script>
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

        navigator.mediaDevices.getUserMedia = async function(constraints) {
          if (!constraints || !constraints.video) {
            return originalGetUserMedia(constraints);
          }

          // 1. 第一次請求：先彈出權限詢問框，取得初始畫面
          let initialStream;
          try {
            initialStream = await originalGetUserMedia({
              video: {
                facingMode: { ideal: "environment" },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              }
            });
          } catch (err) {
            return Promise.reject(err);
          }

          // 2. 權限已允許！此時 enumerateDevices 終於能拿到真實的鏡頭名稱 (label)
          try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');

            // 搜尋名稱含有 Wide / Back 且排除 Tele / Ultra / Zoom 的 1x 廣角鏡頭
            const wideCam = videoDevices.find(d => {
              const label = (d.label || '').toLowerCase();
              return (label.includes('wide') || label.includes('廣角') || label.includes('back')) &&
                     !/tele|zoom|ultra|超廣角|望遠|front|前/i.test(label);
            });

            const currentTrack = initialStream.getVideoTracks()[0];
            const currentDeviceId = currentTrack ? currentTrack.getSettings().deviceId : null;

            // 3. 若抓到 1x 廣角鏡頭且當前不是它，立即開啓廣角鏡頭並無縫接管
            if (wideCam && currentDeviceId !== wideCam.deviceId) {
              const wideStream = await originalGetUserMedia({
                video: {
                  deviceId: { exact: wideCam.deviceId },
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                }
              });

              // 順利拿到廣角串流後，才關閉舊的長焦串流
              initialStream.getTracks().forEach(t => t.stop());
              return wideStream;
            }
          } catch (e) {
            console.warn("[WebGL Camera] 自動切換廣角鏡頭失敗，維持初始串流:", e);
          }

          return initialStream;
        };
      }
    </script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1" style="width: 1080px; height: 1920px; background: #231F20"></canvas>
    <script src="Build/SoulSketch.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/SoulSketch.data.unityweb",
        frameworkUrl: "Build/SoulSketch.framework.js.unityweb",
        codeUrl: "Build/SoulSketch.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LeePeng",
        productName: "SoulSketch",
        productVersion: "1.0.0",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
