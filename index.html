<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | SoulSketch</title>

    <!-- ⭕ 解鎖 Channel 5 綁定：取得權限後以無縫 Track 替換強制切至 1x 原生廣角 -->
    <script>
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);

        navigator.mediaDevices.getUserMedia = async function(constraints) {
          if (!constraints || !constraints.video) {
            return originalGetUserMedia(constraints);
          }

          // 1. 冷啟動第一波：請求環境相機以觸發 iOS 權限授權
          let stream = await originalGetUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });

          try {
            // 2. 授權後 enumerateDevices 成功取得真實鏡頭標籤
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');

            // 3. 排除預設通道 (Channel 5/Triple/Tele) 並精準定位 1x 原生廣角鏡頭 (Wide)
            const wideCam = videoDevices.find(d => {
              const label = (d.label || '').toLowerCase();
              return (label.includes('wide') || label.includes('廣角') || label.includes('back')) &&
                     !/tele|zoom|ultra|超廣角|望遠|front|前|triple|dual/i.test(label);
            });

            const currentTrack = stream.getVideoTracks()[0];
            const currentSettings = currentTrack ? currentTrack.getSettings() : {};

            // 4. 若目前處於 Channel 5 (非 1x 廣角)，開啟真正的 1x 廣角鏡頭並無縫接管
            if (wideCam && currentSettings.deviceId !== wideCam.deviceId) {
              const wideStream = await originalGetUserMedia({
                video: {
                  deviceId: { exact: wideCam.deviceId },
                  width: { ideal: 1280 },
                  height: { ideal: 720 }
                }
              });

              // 廣角串流成功建立後，再關閉舊的 Channel 5 串流，避免綠點斷開
              currentTrack.stop();
              return wideStream;
            }
          } catch (err) {
            console.warn("[WebGL Camera] 無法切換至廣角鏡頭，使用預設串流:", err);
          }

          return stream;
        };
      }
    </script>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1" style="width: 1080px; height: 1920px; background: #231F20"></canvas>
    <script src="Build/SoulSketch.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/SoulSketch.data.unityweb",
        frameworkUrl: "Build/SoulSketch.framework.js.unityweb",
        codeUrl: "Build/SoulSketch.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "LeePeng",
        productName: "SoulSketch",
        productVersion: "1.0.0",
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
